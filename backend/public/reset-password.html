<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset password — CZEDR</title>
  <style>
    :root {
      --bg: #2a2a2c;
      --card: #353538;
      --text: #e7ecf3;
      --muted: #b0b5bc;
      --gold: #ffc42e;
      --red: #e31e24;
      --green: #3dd68c;
      --orange: #f58220;
      --border: #454548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem 2rem;
    }
    .wrap { max-width: 24rem; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; }
    .brand img { width: 48px; height: auto; }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.25rem; line-height: 1.45; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input {
      width: 100%;
      font-size: 16px;
      padding: 0.75rem 0.85rem;
      border: none;
      border-radius: 6px;
      background: var(--orange);
      color: #1a1a1a;
      margin-bottom: 0.85rem;
    }
    input::placeholder { color: rgba(0, 0, 0, 0.45); }
    button {
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem;
      border: none;
      border-radius: 6px;
      background: var(--red);
      color: #fff;
      margin-top: 0.25rem;
    }
    button:disabled { opacity: 0.6; }
    .msg { margin-top: 1rem; font-size: 0.95rem; line-height: 1.45; }
    .msg.err { color: #f87171; }
    .msg.ok { color: var(--green); }
    .foot { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); text-align: center; }
    .foot a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/czedr-mark.png" width="48" height="48" alt="CZEDR">
      <div>
        <h1>Reset password</h1>
        <p class="sub" style="margin:0">Choose a new password for your CZEDR account.</p>
      </div>
    </div>

    <div class="card" id="formCard">
      <label for="password">New password (10+ characters)</label>
      <input id="password" type="password" autocomplete="new-password" placeholder="New password">

      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm password">

      <button type="button" id="submitBtn">Set new password</button>
      <div class="msg" id="message" hidden></div>
    </div>

    <p class="foot">
      After resetting, open the <strong>Czedr</strong> app and sign in.<br>
      <a href="https://czedr.com">czedr.com</a> ·
      <a href="mailto:support@czedr.com">support@czedr.com</a>
    </p>
  </div>
  <script>
(function () {
  function readToken() {
    var q = new URLSearchParams(location.search);
    if (q.get('reset')) return q.get('reset');
    if (q.get('token')) return q.get('token');
    var hash = location.hash.replace(/^#/, '');
    if (!hash) return '';
    var h = new URLSearchParams(hash);
    return h.get('reset') || h.get('token') || hash;
  }

  var token = readToken();
  var msg = document.getElementById('message');
  var btn = document.getElementById('submitBtn');

  function show(text, ok) {
    msg.hidden = false;
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  if (!token) {
    btn.disabled = true;
    show('This reset link is missing or invalid. Request a new one from the app (Forgot password?) or email support@czedr.com.', false);
    return;
  }

  btn.onclick = async function () {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;
    msg.hidden = true;
    if (password.length < 10) {
      show('Password must be at least 10 characters.', false);
      return;
    }
    if (password !== confirm) {
      show('Passwords do not match.', false);
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Updating…';
    try {
      var res = await fetch('/v1/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ reset_token: token, password: password }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        var apiMsg = data.Data && data.Data[0] && data.Data[0].result;
        throw new Error(apiMsg || data.error || data.message || ('Request failed (' + res.status + ')'));
      }
      document.getElementById('formCard').innerHTML =
        '<p class="msg ok">Password updated. Open the Czedr app and sign in with your new password.</p>';
    } catch (e) {
      show(e.message || 'Could not reset password. The link may have expired — try Forgot password? again.', false);
      btn.disabled = false;
      btn.textContent = 'Set new password';
    }
  };
})();
  </script>
</body>
</html>
