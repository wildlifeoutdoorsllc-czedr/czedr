# Build Czedr on a cloud Mac and upload to TestFlight.
# Trigger: Actions tab → "iOS TestFlight" → Run workflow
# Docs: docs/TESTFLIGHT_SETUP.md

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Optional API URL baked into the app (e.g. https://api.yourdomain.com)"
        required: false
        default: ""
      build_number:
        description: "iOS build number (CFBundleVersion), e.g. 50"
        required: false
        default: "78"
  push:
    branches: [main, master, czedrmaster]
    paths:
      - ".github/workflows/ios-testflight.yml"
      - "payooxe/**"
      - "classes/**"
      - "payooxe.xcodeproj/**"
      - "fastlane/**"
      - "Czedr*.h"
      - "Czedr*.m"
      - "Czedr*.swift"
      - "SharedServiceController.*"
      - "leftSwipeViewController.*"
      - "ios/**"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set API base URL for device TestFlight builds
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.CZEDR_API_BASE }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$URL" ]; then
            echo "::error::Set repository variable CZEDR_API_BASE (e.g. http://192.168.x.x:8080) or pass api_base_url when running the workflow."
            exit 1
          fi
          /usr/bin/sed -i '' "s|#define CZEDR_API_BASE \".*\"|#define CZEDR_API_BASE \"$URL\"|" CzedrConfig.h
          echo "CzedrConfig.h API base set to: $URL"
          grep CZEDR_API_BASE CzedrConfig.h

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.4.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install Fastlane
        run: bundle install

      - name: Create temporary keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="${{ secrets.KEYCHAIN_PASSWORD }}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || '80' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          FL_DISABLE_COLORS: "1"
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Czedr-ipa
          path: build/*.ipa
          if-no-files-found: ignore

      # On your Windows dev PC: run WATCH-TESTFLIGHT-AND-RESTART.cmd (or restart manually via RESTART-IPHONE-TESTING.cmd).
      - name: Local dev reminder
        if: success()
        run: |
          echo "::notice::TestFlight upload finished (build ${BUILD_NUMBER:-unknown})."
          echo "::notice::On Windows: run RESTART-IPHONE-TESTING.cmd or leave WATCH-TESTFLIGHT-AND-RESTART.cmd running."
