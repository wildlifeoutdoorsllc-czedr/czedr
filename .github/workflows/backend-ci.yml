# Fast checks: no MySQL, no API server. Catches env-default regressions and PHP syntax errors.

name: Backend checks

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "scripts/**/*.php"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "backend/**"
      - "scripts/**/*.php"
      - ".github/workflows/backend-ci.yml"

jobs:
  php-checks:
    name: PHP env + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Production-safe env defaults
        run: php scripts/test-env-security.php

      - name: PHP syntax (backend + scripts)
        run: find backend scripts -name '*.php' -exec php -l {} \;
